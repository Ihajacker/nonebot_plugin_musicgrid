[tool.poetry]
name = "nonebot-plugin-musicgrid"
version = "0.1.0"
description = "网易云歌单音乐墙生成插件：粘贴歌单链接，生成 Topsters 风格专辑墙拼图"
authors = ["Dorothy <ihajacker@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "nonebot_plugin_musicgrid"}]
include = ["nonebot_plugin_musicgrid/fonts/*.ttf"]

[tool.poetry.dependencies]
python = "^3.9"
httpx = ">=0.27.2"
pillow = ">=9.0"
nonebot2 = "^2.0.0rc3"
nonebot-adapter-onebot = "^2.2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
